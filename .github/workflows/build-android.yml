name: Frahoosh Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zip unzip curl wget autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake python3-virtualenv

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.36

      - name: Verify project
        run: |
          set -eux
          test -f buildozer.spec
          test -f mobile/main.py
          test -f mobile/config.py
          test -f mobile/services/api.py
          python --version
          buildozer --version

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd "$SDK/cmdline-tools"
            rm -rf latest tmp commandlinetools.zip

            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip

            mkdir tmp
            unzip -q commandlinetools.zip -d tmp
            mv tmp/cmdline-tools latest

            rm -rf tmp commandlinetools.zip
          fi

          mkdir -p "$SDK/tools/bin"

          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"

          chmod +x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDK/cmdline-tools/latest/bin/avdmanager"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"

          sdkmanager --version

      - name: Accept Android licenses
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

      - name: Install Android SDK components
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"

          echo "===== FRAHOOSH APK BUILD ====="
          python --version
          buildozer --version
          java -version
          sdkmanager --version

          echo "===== BUILD CONFIG ====="
          grep -E '^(android\.api|android\.minapi|android\.ndk|android\.ndk_api|android\.archs|requirements)' buildozer.spec || true

          echo "===== START BUILD ====="
          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-Build-Logs
          path: |
            .buildozer/**/*.log
            .buildozer/**/build.log
          if-no-files-found: ignore
          retention-days: 7

