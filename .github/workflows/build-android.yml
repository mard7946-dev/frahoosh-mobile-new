```yaml
name: Frahoosh Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.34"

      - name: Check environment
        run: |
          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

      - name: Verify project
        run: |
          test -f buildozer.spec
          test -d mobile

          echo "Project structure:"
          ls -la

          echo "Mobile directory:"
          find mobile -maxdepth 2 -type f | sort

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_TOOLS="$SDK/cmdline-tools/latest/bin"
          SDKMANAGER="$CMDLINE_TOOLS/sdkmanager"

          echo "Android SDK:"
          echo "$SDK"

          echo "Command-line tools:"
          echo "$CMDLINE_TOOLS"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at expected path."
            echo "Searching for sdkmanager..."

            find "$SDK" \
              -type f \
              -name "sdkmanager" \
              -print || true

            exit 1
          fi

          echo "sdkmanager found:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK preparation completed."

      - name: Prepare Buildozer SDK compatibility
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Preparing SDK compatibility for Buildozer..."

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          if [ -f "$SDK/cmdline-tools/latest/bin/avdmanager" ]; then
            ln -sf \
              "$SDK/cmdline-tools/latest/bin/avdmanager" \
              "$SDK/tools/bin/avdmanager"
          fi

          echo "Buildozer SDK manager path:"
          ls -la "$SDK/tools/bin"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Checking platform..."
          test -d "$SDK/platforms/android-35"

          echo "Checking build tools..."
          test -d "$SDK/build-tools/35.0.0"

          echo "Checking AIDL..."
          test -x "$SDK/build-tools/35.0.0/aidl"

          echo "AIDL version:"
          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo "Checking SDK manager compatibility..."
          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "Android SDK is ready."

      - name: Build APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          set -e

          echo "Starting Buildozer..."

          buildozer -v android debug

      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "Generated APK files:"

          find bin \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-Build-Logs
          path: |
            .buildozer/**/*.log
            .buildozer/**/build.log
          if-no-files-found: ignore
          retention-days: 7
```
