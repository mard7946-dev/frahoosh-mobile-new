name: Frahoosh Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:

  build:

    name: Build Frahoosh APK

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON 3.11 HOST
      # ============================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |

          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      # ============================================================
      # VERIFY HOST
      # ============================================================

      - name: Verify host environment
        shell: bash
        run: |

          set -euxo pipefail

          echo "============================================"
          echo "FRAHOOSH ANDROID BUILD"
          echo "============================================"

          echo "Python:"
          python --version

          python - <<'PY'
          import sys

          print("Python executable:", sys.executable)
          print("Python version:", sys.version)

          if sys.version_info[:2] != (3, 11):
              raise SystemExit(
                  "ERROR: Host Python must be 3.11"
              )
          PY

          echo "Java:"
          java -version

      # ============================================================
      # INSTALL BUILDOZER
      # ============================================================

      - name: Install Buildozer
        shell: bash
        run: |

          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.37"

          buildozer --version

      # ============================================================
      # VERIFY FRAHOOSH CONFIGURATION
      # ============================================================

      - name: Verify Frahoosh configuration
        shell: bash
        run: |

          set -euxo pipefail

          echo "============================================"
          echo "BUILDOZER SPEC"
          echo "============================================"

          cat buildozer.spec

          echo "============================================"
          echo "CHECK PYTHON REQUIREMENT"
          echo "============================================"

          grep -n "^requirements" buildozer.spec

          if grep -q "python3==3.11.10" buildozer.spec; then
            echo "ERROR: Python 3.11 must NOT be pinned inside APK requirements."
            exit 1
          fi

          echo "Python requirement is correct."

          echo "============================================"
          echo "CHECK P4A"
          echo "============================================"

          grep -n "^p4a" buildozer.spec

          echo "============================================"
          echo "CHECK ANDROID"
          echo "============================================"

          grep -E \
            "^(android.api|android.minapi|android.ndk|android.ndk_api|android.archs)" \
            buildozer.spec

      # ============================================================
      # CLEAN EVERYTHING
      # ============================================================

      - name: Clean Build
        shell: bash
        run: |

          set -euxo pipefail

          echo "============================================"
          echo "CLEANING BUILD"
          echo "============================================"

          rm -rf .buildozer
          rm -rf bin

          echo "Clean complete."

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build Frahoosh APK
        shell: bash
        run: |

          set -euxo pipefail

          echo "============================================"
          echo "START FRAHOOSH APK BUILD"
          echo "============================================"

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "============================================"
          echo "HOST PYTHON"
          echo "============================================"

          python --version

          echo "============================================"
          echo "JAVA"
          echo "============================================"

          java -version

          echo "============================================"
          echo "BUILDOZER"
          echo "============================================"

          buildozer --version

          echo "============================================"
          echo "P4A CONFIGURATION"
          echo "============================================"

          grep -E \
            "^(p4a.fork|p4a.branch|p4a.commit|p4a.bootstrap)" \
            buildozer.spec

          echo "============================================"
          echo "ANDROID CONFIGURATION"
          echo "============================================"

          grep -E \
            "^(android.api|android.minapi|android.ndk|android.ndk_api|android.archs)" \
            buildozer.spec

          echo "============================================"
          echo "REQUIREMENTS"
          echo "============================================"

          grep "^requirements" buildozer.spec

          echo "============================================"
          echo "BUILD"
          echo "============================================"

          buildozer -v android debug

          echo "============================================"
          echo "APK SEARCH"
          echo "============================================"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK output
        shell: bash
        run: |

          set -euxo pipefail

          echo "============================================"
          echo "VERIFY APK"
          echo "============================================"

          if ! find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            | grep -q .; then

            echo "ERROR: APK/AAB was not produced."
            exit 1

          fi

          echo "============================================"
          echo "APK SUCCESSFULLY CREATED"
          echo "============================================"

          ls -lah bin/

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: Frahoosh-Android-APK

          path: |
            bin/*.apk
            bin/*.aab

          if-no-files-found: error
