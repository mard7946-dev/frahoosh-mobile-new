name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================
      # PYTHON 3.11
      # ============================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: "pip"

      # ============================================
      # JAVA 17
      # ============================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================
      # SYSTEM PACKAGES
      # ============================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      # ============================================
      # VERIFY ENVIRONMENT
      # ============================================

      - name: Verify environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "FRAHOOSH BUILD ENVIRONMENT"
          echo "======================================"

          python --version
          python -c "import sys; print('Python executable:', sys.executable)"
          python -c "print('Python version:', __import__('sys').version)"

          java -version

      # ============================================
      # INSTALL BUILD TOOLS
      # ============================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.37"

          buildozer --version

      # ============================================
      # VERIFY BUILD CONFIGURATION
      # ============================================

      - name: Verify build configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "BUILDOZER CONFIGURATION"
          echo "======================================"

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|p4a.bootstrap|p4a.branch|p4a.commit)' \
            buildozer.spec || true

          echo "======================================"
          echo "PYTHON REQUIREMENT CHECK"
          echo "======================================"

          grep -n \
            'requirements' \
            buildozer.spec || true

      # ============================================
      # CLEAN EVERYTHING
      # ============================================

      - name: Clean Build
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "CLEANING PREVIOUS BUILDS"
          echo "======================================"

          rm -rf .buildozer
          rm -rf bin

          echo "Clean complete."

      # ============================================
      # BUILD APK
      # ============================================

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "STARTING FRAHOOSH APK BUILD"
          echo "======================================"

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "======================================"
          echo "HOST PYTHON"
          echo "======================================"

          python --version

          python - <<'PY'
          import sys

          print("Python executable:", sys.executable)
          print("Python version:", sys.version)

          if sys.version_info[:2] != (3, 11):
              raise SystemExit(
                  "ERROR: GitHub Actions Python is not 3.11"
              )
          PY

          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"

          buildozer --version

          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version

          echo "======================================"
          echo "BUILD CONFIGURATION"
          echo "======================================"

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|p4a.bootstrap)' \
            buildozer.spec || true

          echo "======================================"
          echo "IMPORTANT PYTHON VERSION"
          echo "======================================"

          grep -n \
            'python3==3.11.10' \
            buildozer.spec

          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          buildozer -v android debug

          echo "======================================"
          echo "APK SEARCH"
          echo "======================================"

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # ============================================
      # UPLOAD APK
      # ============================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Android-APK
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
