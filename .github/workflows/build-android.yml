name: Frahoosh Android Build

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Frahoosh APK
runs-on: ubuntu-22.04

```
env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: pip

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Install Linux dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        build-essential \
        ccache \
        git \
        zip \
        unzip \
        curl \
        wget \
        autoconf \
        automake \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        libtinfo6 \
        libffi-dev \
        libssl-dev \
        cmake \
        python3-virtualenv

  - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip setuptools wheel
      python -m pip install "buildozer==1.5.0"
      python -m pip install "cython==0.29.36"

  - name: Verify project
    run: |
      set -eux
      test -f buildozer.spec
      test -d mobile
      test -f mobile/main.py
      echo "Project structure OK"

  - name: Prepare Android SDK
    shell: bash
    run: |
      set -euxo pipefail

      SDK="$ANDROID_HOME"

      mkdir -p "$SDK/cmdline-tools"

      if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
        cd "$SDK/cmdline-tools"

        rm -rf latest tmp commandlinetools.zip

        wget -q \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
          -O commandlinetools.zip

        mkdir tmp
        unzip -q commandlinetools.zip -d tmp
        mv tmp/cmdline-tools latest

        rm -rf tmp commandlinetools.zip
      fi

      mkdir -p "$SDK/tools/bin"

      ln -sf \
        "$SDK/cmdline-tools/latest/bin/sdkmanager" \
        "$SDK/tools/bin/sdkmanager"

      ln -sf \
        "$SDK/cmdline-tools/latest/bin/avdmanager" \
        "$SDK/tools/bin/avdmanager"

      chmod +x \
        "$SDK/cmdline-tools/latest/bin/sdkmanager" \
        "$SDK/cmdline-tools/latest/bin/avdmanager"

      echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      echo "$SDK/tools/bin" >> "$GITHUB_PATH"

      export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"

      command -v sdkmanager
      sdkmanager --version

  - name: Accept Android SDK licenses
    shell: bash
    run: |
      set -euxo pipefail

      SDK="$ANDROID_HOME"
      export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"

      mkdir -p "$SDK/licenses"

      yes | sdkmanager --sdk_root="$SDK" --licenses || true

      echo "Android SDK licenses accepted."

  - name: Install Android SDK components
    shell: bash
    run: |
      set -euxo pipefail

      SDK="$ANDROID_HOME"
      export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"

      sdkmanager --sdk_root="$SDK" \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

      echo "Installed Android SDK components:"
      sdkmanager --sdk_root="$SDK" --list_installed

  - name: Clean previous Buildozer state
    shell: bash
    run: |
      set -euxo pipefail

      rm -rf .buildozer
      rm -rf bin

      mkdir -p .buildozer

      echo "Clean Buildozer state prepared."

  - name: Pin python-for-android
    shell: bash
    run: |
      set -euxo pipefail

      python - <<'PY'
      from pathlib import Path

      p = Path("buildozer.spec")
      text = p.read_text(encoding="utf-8")

      if "p4a.branch" not in text:
          text += "\n# Python-for-Android compatibility pin\n"
          text += "p4a.branch = master\n"

      if "p4a.commit" not in text:
          text += "p4a.commit = 58d2114\n"

      p.write_text(text, encoding="utf-8")

      print("p4a configuration:")
      for line in p.read_text(encoding="utf-8").splitlines():
          if line.startswith("p4a."):
              print(line)
      PY

  - name: Build Frahoosh APK
    shell: bash
    run: |
      set -euxo pipefail

      export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
      export ANDROID_SDK_ROOT="$ANDROID_HOME"
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"

      echo "======================================"
      echo "STARTING FRAHOOSH APK BUILD"
      echo "======================================"

      echo "Python:"
      python --version

      echo "Buildozer:"
      buildozer --version

      echo "Java:"
      java -version

      echo "SDK:"
      sdkmanager --version

      echo "Build configuration:"
      grep -E '^(android\.api|android\.minapi|android\.ndk|android\.ndk_api|p4a\.)' buildozer.spec || true

      buildozer -v android debug

  - name: Verify APK
    if: success()
    shell: bash
    run: |
      set -euxo pipefail

      echo "APK files:"
      find bin -type f -name "*.apk" -print

      test -n "$(find bin -type f -name '*.apk' -print -quit)"

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Frahoosh-Mobile-APK
      path: bin/*.apk
      if-no-files-found: error
      retention-days: 14

  - name: Upload Build Logs
    if: failure()
    uses: actions/upload-artifact@v4
    with:
      name: Frahoosh-Mobile-Build-Logs
      path: |
        .buildozer/**/*.log
        .buildozer/**/build.log
      if-no-files-found: ignore
      retention-days: 7
```
