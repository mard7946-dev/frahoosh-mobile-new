name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: "pip"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      - name: Verify environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "FRAHOOSH BUILD ENVIRONMENT"
          echo "======================================"

          python --version
          python -c "import sys; print(sys.executable)"
          python -c "print(sys.version)"

          java -version

      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.37"

          buildozer --version

      - name: Verify build configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "BUILDOZER CONFIGURATION"
          echo "======================================"

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|p4a.bootstrap|p4a.branch|p4a.commit)' \
            buildozer.spec || true

      - name: Clean Build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

          echo "Clean complete."

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "======================================"
          echo "PYTHON"
          echo "======================================"

          python --version

          python - <<'PY'
          import sys

          print("Python executable:", sys.executable)
          print("Python version:", sys.version)

          if sys.version_info[:2] != (3, 11):
              raise SystemExit("ERROR: Python 3.11 is required")
          PY

          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"

          buildozer --version

          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version

          echo "======================================"
          echo "BUILD CONFIG"
          echo "======================================"

          grep -E \
            '^(requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|p4a.bootstrap)' \
            buildozer.spec || true

          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          buildozer -v android debug

          echo "======================================"
          echo "APK SEARCH"
          echo "======================================"

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Android-APK
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
