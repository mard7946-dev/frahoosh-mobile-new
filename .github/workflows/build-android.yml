name: Frahoosh Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            python3-virtualenv

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "buildozer @ git+https://github.com/kivy/buildozer.git"
          python -m pip install \
            "cython==0.29.34" \
            "legacy-cgi"

      - name: Verify Python and Buildozer
        run: |
          python --version
          python -m pip --version
          buildozer --version

      - name: Verify project
        run: |
          test -f buildozer.spec
          test -d mobile

          echo "===== buildozer.spec ====="
          cat buildozer.spec

          echo "===== mobile ====="
          find mobile -maxdepth 2 -type f | sort

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Android SDK:"
          echo "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK" -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK" -maxdepth 6 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          echo "Installing Android SDK components..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Checking AIDL..."

          test -x "$SDK/build-tools/35.0.0/aidl"

          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo "Android SDK ready."

      - name: Clean previous Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Frahoosh APK
        shell: bash
        run: |
          set -e

          echo "Starting Android build..."

          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "===== APK SEARCH ====="
          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-Build-Logs
          path: |
            .buildozer/**/*.log
            .buildozer/**/build.log
          if-no-files-found: ignore
          retention-days: 7
