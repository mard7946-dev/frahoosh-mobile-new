name: Frahoosh Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frahoosh-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FRAHOOSH_SUPABASE_URL: ${{ secrets.FRAHOOSH_SUPABASE_URL }}
      FRAHOOSH_SUPABASE_ANON_KEY: ${{ secrets.FRAHOOSH_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Upgrade Python packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install "buildozer==1.5.0"

      - name: Install compatible Cython
        run: |
          python -m pip install "cython==0.29.34"

      - name: Check environment
        run: |
          echo "========== PYTHON =========="
          python --version
          which python

          echo "========== JAVA =========="
          java -version

          echo "========== BUILDOZER =========="
          buildozer --version

          echo "========== PROJECT =========="
          find . -maxdepth 3 -type f | sort

      - name: Verify build configuration
        run: |
          test -f buildozer.spec
          test -d mobile
          echo "buildozer.spec found"
          echo "mobile directory found"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: List generated APK
        if: always()
        run: |
          echo "========== APK FILES =========="
          find bin -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-Build-Logs
          path: |
            .buildozer/**/*.log
            .buildozer/**/build.log
          if-no-files-found: ignore
          retention-days: 7
