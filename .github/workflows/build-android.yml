name: Frahoosh Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master


jobs:

  build:

    name: Build Frahoosh APK

    runs-on: ubuntu-22.04


    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # =========================================================
      # HOST PYTHON 3.11
      # =========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install system dependencies
        shell: bash
        run: |

          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            autopoint \
            gettext


      # =========================================================
      # VERIFY HOST
      # =========================================================

      - name: Verify host environment
        shell: bash
        run: |

          set -euxo pipefail

          echo "=========================================="
          echo "FRAHOOSH BUILD ENVIRONMENT"
          echo "=========================================="

          python --version

          python - <<'PY'
          import sys

          print("Python executable:", sys.executable)
          print("Python version:", sys.version)

          if sys.version_info[:2] != (3, 11):
              raise SystemExit(
                  "ERROR: HOST Python must be 3.11"
              )
          PY

          java -version


      # =========================================================
      # INSTALL BUILDOZER
      # =========================================================

      - name: Install Buildozer
        shell: bash
        run: |

          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.37"

          buildozer --version


      # =========================================================
      # VERIFY PROJECT
      # =========================================================

      - name: Verify Frahoosh project
        shell: bash
        run: |

          set -euxo pipefail

          echo "=========================================="
          echo "PROJECT STRUCTURE"
          echo "=========================================="

          pwd

          echo ""
          echo "ROOT FILES:"
          ls -la

          echo ""
          echo "MOBILE FILES:"
          find mobile -maxdepth 3 -type f -print

          echo ""
          echo "CHECKING main.py..."

          test -f mobile/main.py

          echo "OK: mobile/main.py exists."


      # =========================================================
      # CHECK PYTHON SYNTAX
      # =========================================================

      - name: Check Python syntax
        shell: bash
        run: |

          set -euxo pipefail

          echo "=========================================="
          echo "PYTHON SYNTAX CHECK"
          echo "=========================================="

          python -m compileall -q mobile

          echo "Python syntax check completed successfully."


      # =========================================================
      # VERIFY BUILDOZER CONFIG
      # =========================================================

      - name: Verify Buildozer configuration
        shell: bash
        run: |

          set -euxo pipefail

          echo "=========================================="
          echo "BUILDOZER CONFIGURATION"
          echo "=========================================="

          test -f buildozer.spec

          grep -E \
            '^(source.dir|requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|p4a.bootstrap|p4a.fork|p4a.branch|p4a.commit)' \
            buildozer.spec || true

          echo ""
          echo "=========================================="
          echo "PYTHON REQUIREMENT"
          echo "=========================================="

          grep -n '^requirements' buildozer.spec

          echo ""
          echo "=========================================="
          echo "SOURCE DIRECTORY"
          echo "=========================================="

          grep -q '^source.dir = mobile$' buildozer.spec

          echo "OK: source.dir = mobile"


      # =========================================================
      # CLEAN BUILD
      # =========================================================

      - name: Clean Build
        shell: bash
        run: |

          set -euxo pipefail

          echo "=========================================="
          echo "CLEANING BUILDOZER"
          echo "=========================================="

          rm -rf .buildozer
          rm -rf bin

          echo "Clean complete."


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build Frahoosh APK
        shell: bash
        run: |

          set -o pipefail

          echo "=========================================="
          echo "START FRAHOOSH APK BUILD"
          echo "=========================================="

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"


          # =====================================================
          # HOST PYTHON
          # =====================================================

          echo ""
          echo "=========================================="
          echo "HOST PYTHON"
          echo "=========================================="

          python --version

          python - <<'PY'
          import sys

          print("Python executable:", sys.executable)
          print("Python version:", sys.version)

          if sys.version_info[:2] != (3, 11):
              raise SystemExit(
                  "ERROR: Host Python is not 3.11"
              )
          PY


          # =====================================================
          # BUILDOZER
          # =====================================================

          echo ""
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          buildozer --version


          # =====================================================
          # JAVA
          # =====================================================

          echo ""
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version


          # =====================================================
          # PROJECT
          # =====================================================

          echo ""
          echo "=========================================="
          echo "PROJECT ENTRYPOINT"
          echo "=========================================="

          test -f mobile/main.py

          echo "mobile/main.py FOUND"


          # =====================================================
          # CONFIG
          # =====================================================

          echo ""
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^(source.dir|requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|p4a.bootstrap|p4a.fork|p4a.branch|p4a.commit)' \
            buildozer.spec || true


          # =====================================================
          # BUILD
          # =====================================================

          echo ""
          echo "=========================================="
          echo "RUNNING BUILDOZER"
          echo "=========================================="

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "BUILDOZER EXIT CODE: ${BUILD_STATUS}"
          echo "=========================================="

          if [ "${BUILD_STATUS}" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "IMPORTANT ERROR LINES"
            echo "=========================================="

            grep -Ei \
              'error:|exception|traceback|failed|syntaxerror|no matching distribution|license|ndk|python3\.[0-9]+' \
              build.log | tail -n 200 || true

            exit "${BUILD_STATUS}"

          fi


          # =====================================================
          # APK SEARCH
          # =====================================================

          echo ""
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: Frahoosh-Android-APK

          path: |
            bin/*.apk
            bin/*.aab

          if-no-files-found: error


      # =========================================================
      # UPLOAD BUILD LOG
      # =========================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: Frahoosh-Build-Log

          path: build.log

          if-no-files-found: ignore
