name: Frahoosh Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            curl

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.5.0"

          python -m pip install \
            "cython==0.29.34"

          python -m pip install \
            "legacy-cgi"

      - name: Verify environment
        shell: bash
        run: |
          set -e

          echo "===== Python ====="
          python --version

          echo "===== Java ====="
          java -version

          echo "===== Buildozer ====="
          buildozer --version

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f buildozer.spec
          test -d mobile

          echo "===== buildozer.spec ====="
          cat buildozer.spec

          echo "===== Mobile files ====="
          find mobile -maxdepth 3 -type f | sort

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "======================================"
          echo "Android SDK"
          echo "$SDK"
          echo "======================================"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK" \
              -type f \
              -name sdkmanager \
              | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$SDK" \
              -maxdepth 7 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Checking required Build Tools..."

          test -d "$SDK/build-tools/35.0.0"

          echo "Checking AIDL..."

          test -x "$SDK/build-tools/35.0.0/aidl"

          "$SDK/build-tools/35.0.0/aidl" --version || true

          echo "Android SDK preparation complete."

      - name: Detect Android NDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Searching for installed Android NDK..."

          if [ ! -d "$SDK/ndk" ]; then
            echo "ERROR: NDK directory does not exist."
            exit 1
          fi

          NDK="$(
            find "$SDK/ndk" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found."
            find "$SDK/ndk" -maxdepth 2 -type d -print || true
            exit 1
          fi

          echo "Detected NDK:"
          echo "$NDK"

          echo "ANDROIDNDK=$NDK" >> "$GITHUB_ENV"

      - name: Configure Buildozer Android paths
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK="$ANDROIDNDK"

          echo "SDK:"
          echo "$SDK"

          echo "NDK:"
          echo "$NDK"

          cat >> buildozer.spec <<EOF

          # CI Android SDK configuration
          android.sdk_path = $SDK
          android.ndk_path = $NDK
          EOF

          echo "===== Final buildozer.spec ====="
          cat buildozer.spec

      - name: Clean Buildozer state
        shell: bash
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          echo "Buildozer state cleaned."

      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "ANDROIDSDK:"
          echo "$ANDROIDSDK"

          echo "ANDROIDNDK:"
          echo "$ANDROIDNDK"

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -d "$ANDROIDNDK"

          echo "Android configuration OK."

      - name: Build Frahoosh APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "STARTING FRAHOOSH ANDROID BUILD"
          echo "======================================"

          buildozer -v android debug

      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "===== APK SEARCH ====="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-Build-Logs
          path: |
            .buildozer/**/*.log
            .buildozer/**/build.log
          if-no-files-found: ignore
          retention-days: 7
