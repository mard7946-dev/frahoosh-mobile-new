name: Frahoosh Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.36

      - name: Verify project
        run: |
          set -euxo pipefail

          test -f buildozer.spec
          test -f mobile/main.py

          echo "======================================"
          echo "FRAHOOSH BUILD CONFIGURATION"
          echo "======================================"

          python --version
          buildozer --version
          java -version

          echo
          echo "----- buildozer.spec -----"
          grep -E \
            '^(title|package.name|package.domain|source.dir|version|requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|p4a.branch|p4a.commit)' \
            buildozer.spec || true

      - name: Clean Build
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "STARTING FRAHOOSH APK BUILD"
          echo "======================================"

          buildozer -v android debug

      - name: Show Build Output
        if: always()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find . -type f -name "*.apk" -print || true

          echo
          echo "======================================"
          echo "BIN DIRECTORY"
          echo "======================================"

          ls -lah bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: Frahoosh-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
