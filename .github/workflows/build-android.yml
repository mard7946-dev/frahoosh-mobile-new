name: Frahoosh Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FRAHOOSH_SUPABASE_URL: ${{ secrets.FRAHOOSH_SUPABASE_URL }}
      FRAHOOSH_SUPABASE_ANON_KEY: ${{ secrets.FRAHOOSH_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.34

      - name: Check project
        run: |
          echo "Python:"
          python --version
          echo "Java:"
          java -version
          echo "Buildozer:"
          buildozer --version
          echo "Project:"
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show APK
        if: always()
        run: |
          echo "Generated APK files:"
          find bin -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
