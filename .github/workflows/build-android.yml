name: Frahoosh Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # Java
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # Linux dependencies
      # ============================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            python3-virtualenv

      # ============================================================
      # Buildozer
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.36"

      # ============================================================
      # Verify project
      # ============================================================

      - name: Verify project
        run: |
          set -eux

          test -f buildozer.spec
          test -d mobile
          test -f mobile/main.py

          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"

          python --version
          buildozer --version

          echo "Project structure OK"

      # ============================================================
      # Prepare Android SDK
      # ============================================================

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then

            cd "$SDK/cmdline-tools"

            rm -rf latest tmp commandlinetools.zip

            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O commandlinetools.zip

            mkdir tmp

            unzip -q commandlinetools.zip -d tmp

            mv tmp/cmdline-tools latest

            rm -rf tmp commandlinetools.zip

          fi

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          chmod +x \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/latest/bin/avdmanager"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"

          command -v sdkmanager
          sdkmanager --version

      # ============================================================
      # Android licenses
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"

          mkdir -p "$SDK/licenses"

          yes | sdkmanager \
            --sdk_root="$SDK" \
            --licenses || true

          echo "Android SDK licenses accepted."

      # ============================================================
      # Android SDK components
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$PATH"

          sdkmanager --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "======================================"
          echo "INSTALLED SDK COMPONENTS"
          echo "======================================"

          sdkmanager \
            --sdk_root="$SDK" \
            --list_installed

      # ============================================================
      # Clean Buildozer
      # ============================================================

      - name: Prepare Buildozer environment
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer

          echo "Build environment prepared."

      # ============================================================
      # Build APK
      # ============================================================

      - name: Build Frahoosh APK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"

          echo "======================================"
          echo "STARTING FRAHOOSH APK BUILD"
          echo "======================================"

          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer --version

          echo "Java:"
          java -version

          echo "Android SDK:"
          sdkmanager --version

          echo "======================================"
          echo "BUILD CONFIGURATION"
          echo "======================================"

          grep -E \
            '^(android\.api|android\.minapi|android\.ndk|android\.ndk_api|requirements)' \
            buildozer.spec || true

          echo "======================================"
          echo "START BUILD"
          echo "======================================"

          buildozer -v android debug

      # ============================================================
      # Find APK
      # ============================================================

      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      # ============================================================
      # Upload APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # Upload logs if build fails
      # ============================================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Mobile-Build-Logs
          path: |
            .buildozer/**/*.log
            .buildozer/**/build.log
          if-no-files-found: ignore
          retention-days: 7
